name: Render Bandar Lampung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'package.json', 'tsconfig.json', '.github/workflows/render.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npx remotion browser ensure
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: bandar-lampung-tempo-dulu
          path: out/bandar-lampung.mp4
          if-no-files-found: error
