name: Render Bandar Lampung
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'story.json', 'voice.json', 'package.json', 'tsconfig.json', '.github/workflows/render.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: pip install faster-whisper==1.2.1
      - name: Download narration and synchronize approved subtitles
        run: python scripts/prepare.py
      - run: npm run check
      - run: npx remotion browser ensure
      - name: Render preview frames
        run: node scripts/previews.mjs
      - run: npm run render
      - name: Verify output duration and audio
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json out/bandar-lampung.mp4 > out/media-info.json
          python - <<'PY'
          import json
          info=json.load(open('out/media-info.json'))
          expected=json.load(open('src/timing.json'))['durationInFrames']/30
          assert abs(float(info['format']['duration'])-expected)<0.2
          assert any(s['codec_type']=='audio' for s in info['streams'])
          assert any(s.get('width')==1080 and s.get('height')==1920 for s in info['streams'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bandar-lampung-sejarah-2d
          path: out/
          if-no-files-found: error
      - name: Save downloadable MP4 and reusable audio to repository
        run: |
          mkdir -p renders
          cp out/bandar-lampung.mp4 renders/bandar-lampung-sejarah.mp4
          cp out/preview-*.png renders/
          cp out/bandar-lampung.srt renders/
          cp out/media-info.json renders/
          python - <<'PY'
          import json
          p='voice.json'
          voice=json.load(open(p))
          voice['url']=''
          voice['note']='Narration is stored in public/narration.mp3. Refresh via vidIQ job only if replacing the audio.'
          open(p,'w').write(json.dumps(voice,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/narration.mp3 public/music.wav src/timing.json voice.json renders/
          git diff --cached --quiet || git commit -m 'Save rendered history video, previews, and reusable narration'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-diagnostics
          path: out/
          if-no-files-found: ignore
