name: Render Codex Creator Episode 03
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['episodes/03-skills/**', '.github/workflows/render-ep03.yml']
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: npm install --no-audit --no-fund
      - run: pip install faster-whisper==1.2.1
      - name: Prepare narration and synchronized captions
        run: python episodes/03-skills/scripts/prepare.py
      - run: npx tsc --project episodes/03-skills/tsconfig.json
      - run: npx remotion browser ensure
      - run: node episodes/03-skills/scripts/previews.mjs
      - name: Render facial rig proof frames
        run: node episodes/03-skills/scripts/host-previews.mjs
      - name: Render host close-up clip
        run: npx remotion render episodes/03-skills/index.ts KodeyHostDemo out/ep03/kodey-host-demo.mp4 --codec=h264 --concurrency=2
      - name: Render MP4
        run: npx remotion render episodes/03-skills/index.ts CodexSkills out/ep03/codex-skills.mp4 --codec=h264 --concurrency=2
      - name: Verify video and audio
        run: |
          ffprobe -v error -show_entries format=duration -show_entries stream=codec_type,width,height -of json out/ep03/codex-skills.mp4 > out/ep03/media-info.json
          python - <<'PY'
          import json
          x=json.load(open('out/ep03/media-info.json'))
          duration=float(x['format']['duration'])
          assert 45 <= duration <= 60, duration
          assert any(s.get('codec_type')=='audio' for s in x['streams'])
          assert any(s.get('width')==1080 and s.get('height')==1920 for s in x['streams'])
          t=json.load(open('episodes/03-skills/timing.json'))
          assert abs(duration-t['durationInFrames']/30)<.2
          assert len(t['scenes'])==8
          print('Verified', duration, 'seconds; alignment', t['alignmentCoverage'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: codex-creator-ep03
          path: out/ep03/
          if-no-files-found: error
      - name: Save downloadable deliverables
        run: |
          mkdir -p renders/ep03
          cp out/ep03/* renders/ep03/
          python - <<'PY'
          import json
          p='episodes/03-skills/voice.json'
          x=json.load(open(p))
          x['url']=''
          x['note']='Reusable narration is in public/episodes/03-skills/narration.mp3.'
          open(p,'w').write(json.dumps(x,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/episodes/03-skills/narration.mp3 public/episodes/03-skills/music.wav episodes/03-skills/timing.json episodes/03-skills/host-motion.json episodes/03-skills/voice.json renders/ep03/
          git diff --cached --quiet || git commit -m 'Save Codex creator episode 03 video and reusable media'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ep03-diagnostics
          path: out/ep03/
          if-no-files-found: ignore
