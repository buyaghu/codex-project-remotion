name: Review Reels Design Options
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['design-review/v1/render.mjs', 'design-review/v1/fonts.py']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: python3 design-review/v1/fonts.py
      - run: npx tsc --project design-review/v1/tsconfig.json
      - run: npx remotion browser ensure
      - run: mkdir -p out/design-review
      - run: node design-review/v1/render.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: reels-design-review
          path: out/design-review/
      - name: Save review outputs and fonts
        run: |
          mkdir -p renders/design-review
          cp out/design-review/* renders/design-review/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f renders/design-review/ public/fonts/review/
          git diff --cached --quiet || git commit -m 'Save three design frames and animated mascot review'
          git push origin HEAD:main
